# Tool-agnostic enforcement layer: applies to every agent and every human (see docs/methodology.md §8).
# Install once:  pre-commit install --hook-type pre-commit --hook-type commit-msg
# Hook revs were current on 2026-09-16 (see docs/research/2026-09-16-dependency-pins.md).
# Refresh them through the research skill (AGENTS.md GR-8).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^services/ingestor/src/
        args: [--config-file=services/ingestor/pyproject.toml]
        # The hook runs mypy in an isolated environment, so every typed runtime dependency the
        # sources import must be listed here; otherwise mypy reports import-not-found and
        # degrades those types to Any.
        additional_dependencies:
          - pydantic==2.13.5
          - pydantic-settings==2.15.0
          - SQLAlchemy==2.0.54
          - pandas-stubs==3.0.5.260914
          - tenacity==9.1.4

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # GR-12: every commit message must follow Conventional Commits (default type list).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files (GR-5)
        entry: "Committing .env files is forbidden (AGENTS.md GR-5). Put placeholders in .env.example instead."
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
