# Scheduled supply-chain checks. Deliberately not a pull-request gate: a newly published
# advisory is news, not a reason to block unrelated work (AGENTS.md GR-8).
name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: pip-audit (pinned dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit runtime and development dependencies
        run: |
          pip-audit --progress-spinner off \
            -r services/ingestor/requirements.txt \
            -r services/ingestor/requirements-dev.txt

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pre-commit only scans the working tree; history needs its own pass
          persist-credentials: false

      - name: Scan the whole history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner --verbose
