# Local stack: database, ingestor and dashboard.
# Configuration comes from .env, which is never committed (AGENTS.md GR-4, GR-5).
services:
  db:
    image: timescale/timescaledb:2.30.0-pg16 # pinned in docs/research/2026-09-16-dependency-pins.md
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finstream}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost: the database is never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingestor:
    build: ./services/ingestor
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # init: PID 1 reaps children and forwards SIGTERM, so shutdown is graceful.
    init: true

  dashboard:
    build: ./services/dashboard
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped
    init: true

volumes:
  pgdata:
