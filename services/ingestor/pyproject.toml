# Tool configuration only. Dependencies live in requirements*.txt (AGENTS.md GR-8),
# and the package is run from src/ via PYTHONPATH rather than being installed.

[tool.ruff]
# 3.11 is the support floor: linting against it prevents 3.12-only rewrites (e.g. PEP 695).
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
# 3.12, not 3.11: numpy ships stubs using PEP 695 `type` statements, which mypy only parses
# when targeting 3.12+. Compatibility with 3.11 is enforced where it actually matters -
# ruff targets py311 (no 3.12-only rewrites) and CI runs the unit tests on 3.11.
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["finstream_ingestor"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "apscheduler.*", "pythonjsonlogger.*", "testcontainers.*",
          "curl_cffi.*", "requests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Docker daemon (testcontainers); excluded with -m 'not integration'",
]

[tool.coverage.run]
source = ["finstream_ingestor"]
branch = true
